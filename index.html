<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chúc mừng sinh nhật!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#050506;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif}
body{display:grid;place-items:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:inline-size;background:#050506;overflow:hidden}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fw{mix-blend-mode:screen}
#txt .it{position:absolute;left:50%;top:var(--y);transform:translate(-50%,-50%) scale(.5);opacity:0;white-space:nowrap;pointer-events:none;
  transition:transform .45s cubic-bezier(.3,1.7,.5,1),opacity .35s}
#txt .it.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.title{--y:10.8%;font:5.6cqw 'Pacifico',cursive;color:#fff;text-shadow:0 0 1.4cqw #ff5fa8,0 0 .6cqw #ff5fa8,0 .3cqw 0 #c2185b}
.title.sm{font-size:4.8cqw}
.pill{--y:11.4%;padding:.55cqw 2.6cqw;border-radius:99cqw;background:rgba(255,255,255,.94);color:#c2185b;font-weight:800;font-size:3cqw;
  box-shadow:0 .4cqw 1.8cqw rgba(255,105,180,.65)}
.pill::before{content:"💖";margin-right:.9cqw}.pill::after{content:"💖";margin-left:.9cqw}
#msg{position:absolute;inset:0;display:none;place-items:center;color:#fff;text-align:center;padding:20px;font-size:18px;background:rgba(0,0,0,.8);z-index:5}
#start{position:fixed;inset:0;z-index:100;background:#050506;display:grid;place-items:center;gap:14px;align-content:center}
#start button{font:800 clamp(20px,4vw,34px) 'Baloo 2';padding:18px 38px;border:0;border-radius:60px;background:linear-gradient(#ff8fc7,#ff4f9a);color:#fff;cursor:pointer;box-shadow:0 0 30px #ff4f9a;animation:pulse 1.2s ease-in-out infinite alternate}
#gate{position:absolute;inset:0;display:none;place-items:center;z-index:6;background:rgba(0,0,0,.5);backdrop-filter:blur(6px)}
#gate.on{display:grid}
#gate .card{width:56cqw;padding:2.6cqw 3cqw;border-radius:3cqw;background:#fff;text-align:center;box-shadow:0 1cqw 4cqw rgba(255,79,154,.45);border:.3cqw solid #ffb3d6}
#gate .gt{font:4.4cqw 'Pacifico',cursive;color:#e91e8c}
#gw{min-height:15cqw;margin:1.4cqw 0;display:flex;flex-direction:column;gap:.9cqw;justify-content:center}
#gw .gl{font-weight:800;font-size:2.2cqw;color:#c2185b;animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#gb{font:800 2.4cqw 'Baloo 2';padding:1cqw 3cqw;border:0;border-radius:60px;background:linear-gradient(#ff8fc7,#ff4f9a);color:#fff;cursor:pointer;box-shadow:0 0 2cqw #ff4f9a}
#gb:disabled{opacity:.6;cursor:default}
@keyframes pulse{to{transform:scale(1.08)}}
</style>
</head>
<body>
<div id="start"><button id="go">🎁 Mở quà sinh nhật</button></div>
<div id="stage">
  <video id="v" playsinline preload="auto"></video>
  <canvas id="fw"></canvas>
  <canvas id="cf"></canvas>
  <div id="txt"></div>
  <div id="gate"><div class="card"><div class="gt">🎂 Chúc Mừng Sinh Nhật! 🎂</div><div id="gw"></div><button id="gb"></button></div></div>
  <div id="msg"><div>Không tìm thấy file video.<br><br>Hãy đặt video cùng thư mục với file này (đúng tên trong CONFIG.video) hoặc chọn file:<br><br><input type="file" id="pick" accept="video/*"></div></div>
</div>

<script>
/* ============ CẤU HÌNH – CHỈNH Ở ĐÂY ============ */
const CONFIG={
  video:"birthday_clean.mp4", // video nền đã xóa logo (đặt cùng thư mục với file HTML này)
  speed:0.7,          // tốc độ video (1 = gốc, nhỏ hơn = chậm hơn)
  giftPause:11.8,     // giây dừng video để hiện hộp thoại (sau khi mọi người vỗ tay xong, trước cảnh tặng hoa)
  giftWishes:["Chúc Công Chúa luôn xinh đẹp và hạnh phúc 🌸","Mọi điều ước của bạn đều thành sự thật ✨","Tuổi mới thật nhiều niềm vui và tiếng cười 🎈","Sức khỏe, bình an và may mắn bên bạn 🍀","Yêu bạn thật nhiều, mãi là công chúa của chúng mình 💖"],
  name:"Công Chúa",
  party:7.0,          // giây bắt đầu tiệc: pháo hoa + giấy + chữ chúc (sau khi thổi nến)
  songStart:6.9,      // giây bắt đầu nhạc Happy Birthday
  songVolume:0.5,     // âm lượng nhạc (0 → 1)
  songTempo:0.45,     // giây / nhịp (nhỏ hơn = nhanh hơn)
  fireworks:true,
  wishes:["Luôn xinh đẹp và hạnh phúc","Mọi điều ước đều thành sự thật","Tuổi mới thật nhiều niềm vui","Mãi là công chúa của chúng mình","Sức khỏe, bình an, may mắn","Yêu bạn nhiều lắm"],
  wishSeconds:2.6     // mỗi câu chúc hiện bao lâu
};
/* ================================================= */
const $=s=>document.querySelector(s);
const V=$('#v'),fw=$('#fw'),cf=$('#cf'),fx=fw.getContext('2d'),cx=cf.getContext('2d');
const W=1280,H=720,FPS=24;fw.width=cf.width=W;fw.height=cf.height=H;
V.muted=true;V.src=CONFIG.video;V.addEventListener('error',()=>{$('#msg').style.display='grid'});
$('#pick').onchange=e=>{const f=e.target.files[0];if(f){V.src=URL.createObjectURL(f);$('#msg').style.display='none'}};

/* ---- random có seed (mỗi lần chạy giống nhau) ---- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(7);const rnd=(a,b)=>a+R()*(b-a),pick=a=>a[Math.floor(R()*a.length)];
const COL=[[255,95,168],[255,216,107],[110,231,255],[157,123,255],[124,242,154],[255,138,92],[255,255,255]];
const rgba=(c,a=1,k=1)=>`rgba(${c[0]*k|0},${c[1]*k|0},${c[2]*k|0},${a})`;

/* ---- hình trái tim / ngôi sao ---- */
function heartPts(n=26){const p=[];for(let i=0;i<n;i++){const t=i/n*6.2832;p.push([16*Math.sin(t)**3/16,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16])}return p}
const HP=heartPts(),HP70=heartPts(70);
function shape(ctx,pts,x,y,s,r){ctx.beginPath();const c=Math.cos(r),sn=Math.sin(r);pts.forEach(([a,b],i)=>{const X=x+(a*c-b*sn)*s,Y=y+(a*sn+b*c)*s;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.closePath()}
function starPath(ctx,x,y,s,r){ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?s*.45:s,a=r+i*Math.PI/5-Math.PI/2;i?ctx.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a)):ctx.moveTo(x+rr*Math.cos(a),y+rr*Math.sin(a))}ctx.closePath()}

/* ---- Lịch pháo hoa (cố định theo thời gian video) ---- */
const bursts=[];{const r2=rng(11),a=(x,y)=>x+r2()*(y-x);let t=CONFIG.party+.15;
 while(t<29.2){const reg=r2()<.5?0:1,cxx=reg?a(880,1190):a(90,400),cyy=a(90,230),k=["ring","ring","heart","ball"][Math.floor(r2()*4)];
  const f=Math.round(t*FPS);bursts.push({f,lf:f-13,cx:cxx,cy:cyy,kind:k,col:COL[Math.floor(r2()*6)]});t+=a(.45,.85)}}
let parts=[],rockets=[],conf=[],stepFi=-1,lastT=0;
function launch(b){rockets.push({x:b.cx+rnd(-30,30),y:H*.55,tx:b.cx,ty:b.cy,n:0,N:13})}
function explode(b){const{cx:x,cy:y,kind:k,col:c}=b,c2=pick(COL.slice(0,6));
 if(k==="heart")HP70.forEach(p=>parts.push({x,y,vx:p[0]*7,vy:p[1]*7-.4,life:0,L:34+Math.floor(R()*13),c,g:.07,d:.955}));
 else for(let i=0;i<95;i++){const an=k==="ball"?rnd(0,6.283):i/95*6.283,sp=k==="ball"?rnd(2,9.5):8.2+rnd(-.3,.3);
  parts.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:0,L:36+Math.floor(R()*19),c:i%3?c:c2,g:.09,d:.955})}
 for(let i=0;i<14;i++)parts.push({x,y,vx:rnd(-1,1),vy:rnd(-1,1),life:0,L:14,c:[255,255,255],g:0,d:.9})}
function newc(burst){conf.push({x:rnd(0,W),y:burst?-rnd(0,H*.9):-20,vx:rnd(-1.2,1.2),vy:rnd(4,9),r:rnd(0,6.28),vr:rnd(-.2,.2),s:rnd(5,9.5),c:pick(COL),
 ph:rnd(0,6.28),vp:rnd(.12,.3),k:R()<.32?'f':R()<.55?'r':R()<.45?'h':R()<.5?'s':'d',wob:rnd(0,6.28)})}

/* ---- 1 bước mô phỏng = 1 khung hình video (24fps) ---- */
function step(fi){const t=fi/FPS;
 fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.16)';fx.fillRect(0,0,W,H);fx.globalCompositeOperation='lighter';
 if(CONFIG.fireworks){
  bursts.forEach(b=>{if(b.lf===fi)launch(b);if(b.f===fi)explode(b)});
  rockets=rockets.filter(r=>{r.n++;const k=r.n/r.N;r.x+=(r.tx-r.x)*.18;r.y=H*.55+(r.ty-H*.55)*(1-(1-k)**2);
   fx.fillStyle='rgba(255,220,140,1)';fx.beginPath();fx.arc(r.x,r.y,3,0,6.283);fx.fill();return r.n<r.N});
  parts=parts.filter(p=>{p.life++;p.vx*=p.d;p.vy=p.vy*p.d+p.g;p.x+=p.vx;p.y+=p.vy;if(p.life>p.L)return false;
   const a=Math.min(1,1.5*(1-p.life/p.L)**.6)*(.8+.2*R());
   fx.fillStyle=rgba(p.c,a*.22);fx.beginPath();fx.arc(p.x,p.y,9,0,6.283);fx.fill();
   fx.fillStyle=rgba(p.c,a);fx.beginPath();fx.arc(p.x,p.y,3,0,6.283);fx.fill();return true})}
 if(t>=CONFIG.party){if(fi===Math.round(CONFIG.party*FPS))for(let i=0;i<260;i++)newc(true);else if(t<26.8){if(R()<.95)newc(false);if(R()<.7)newc(false);if(R()<.4)newc(false)}}
 conf=conf.filter(p=>{p.y+=p.vy;p.wob+=.06;p.x+=p.vx+Math.sin(p.wob)*1.1;p.r+=p.vr;p.ph+=p.vp;return p.y<H+30})}
function reset(){parts=[];rockets=[];conf=[];stepFi=-1;R=rng(7);fx.clearRect(0,0,W,H)}

/* ---- Lấp lánh ---- */
const r3=rng(5),TW=Array.from({length:18},()=>[40+r3()*1200,20+r3()*310,r3()*6.28,.05+r3()*.07,5+r3()*6]);
function draw(t){cx.clearRect(0,0,W,H);
 conf.forEach(p=>{const fl=Math.abs(Math.cos(p.ph)),k=.6+.4*fl;cx.fillStyle=rgba(p.c,1,k);
  if(p.k==='r'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(Math.max(fl,.18),1);cx.fillRect(-p.s,-p.s*.55,p.s*2,p.s*1.1);cx.restore()}
  else if(p.k==='f'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r*.5);for(let i=0;i<5;i++){cx.rotate(1.2566);cx.beginPath();cx.ellipse(0,-p.s*.8,p.s*.5,p.s*.8,0,0,6.283);cx.fill()}cx.fillStyle='#fff6c8';cx.beginPath();cx.arc(0,0,p.s*.42,0,6.283);cx.fill();cx.restore()}
  else if(p.k==='h'){shape(cx,HP,p.x,p.y,p.s*1.5,p.r*.3);cx.fill()}
  else if(p.k==='s'){starPath(cx,p.x,p.y,p.s*1.1,p.r);cx.fill()}
  else{cx.beginPath();cx.arc(p.x,p.y,p.s*.45,0,6.283);cx.fill()}});
 if(t>=CONFIG.party-.3)TW.forEach(([x,y,ph,sp,sz],i)=>{const a=Math.max(0,Math.sin(ph+t*24*sp*2))**3;if(a>.05){cx.globalAlpha=a;cx.fillStyle='#fff';starPath(cx,x,y,sz*(.5+a),0);cx.fill()}});
 cx.globalAlpha=1}

/* ---- Chữ chúc ---- */
const items=[];function addIt(cls,html,t0,t1){const d=document.createElement('div');d.className='it '+cls;d.innerHTML=html;$('#txt').appendChild(d);items.push({d,t0,t1})}
{let t=CONFIG.party+.7;addIt('title','Chúc Mừng Sinh Nhật!',t,CONFIG.party+4.3);t=CONFIG.party+4.5;
 CONFIG.wishes.forEach(w=>{addIt('pill',w,t,t+CONFIG.wishSeconds-.1);t+=CONFIG.wishSeconds});
 addIt('title sm',`Chúc Mừng Sinh Nhật ${CONFIG.name}!`,t+.1,1e9)}
function updText(t){items.forEach(o=>o.d.classList.toggle('on',t>=o.t0&&t<o.t1))}

/* ---- Hộp thoại lời chúc (dừng video trước cảnh tặng hoa) ---- */
const gate={done:false,n:0},GW=CONFIG.giftWishes;
function gateLabel(){$('#gb').textContent=`💌 Bấm để nhận lời chúc (${gate.n+1}/${GW.length})`}
function openGate(){gate.done=true;gate.n=0;V.pause();$('#gw').innerHTML='';$('#gb').disabled=false;gateLabel();$('#gate').classList.add('on')}
$('#gb').onclick=()=>{
 const d=document.createElement('div');d.className='gl';d.textContent=GW[gate.n];$('#gw').appendChild(d);gate.n++;
 if(gate.n<GW.length){gateLabel();return}
 $('#gb').disabled=true;$('#gb').textContent='🌸 Cùng xem món quà nhé!';
 setTimeout(()=>{$('#gate').classList.remove('on');ac&&ac.resume();V.play()},2000)};

/* ---- Vòng lặp chính: bám theo thời gian video ---- */
function frame(){const t=V.currentTime;
 if(!gate.done&&!V.paused&&t>=CONFIG.giftPause)openGate();
 if(!songOn&&!V.paused&&t>=CONFIG.songStart&&t<CONFIG.songStart+1)startSong();
 if(t<lastT-.3)reset();
 const target=Math.floor(t*FPS);let n=target-stepFi;
 if(n>8){stepFi=target-1;n=1}
 for(let i=0;i<n;i++)step(++stepFi);
 lastT=t;draw(t);updText(t);requestAnimationFrame(frame)}

/* ---- Nhạc Happy Birthday (Web Audio, bám theo thời gian video) ---- */
let ac,master,wet;
const NOTE={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
const MEL=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
const NOTES=[];{let t=0;for(let r=0;r<3;r++)MEL.forEach(([n,d])=>{NOTES.push({t,f:NOTE[n],L:d*CONFIG.songTempo,d});t+=d*CONFIG.songTempo})}
function impulse(){const len=ac.sampleRate*.35,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/ac.sampleRate*9)*.5}return b}
function voice(f,when,L,d,out){
 [[1,1,0],[2,.45,6],[3,.2,9],[.5,.25,0]].forEach(([mul,vol,extra])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*mul;
  const tau=1/((d<2?3.2:2.2)+extra);g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol*.4,when+.008);g.gain.setTargetAtTime(0,when+.01,tau);
  o.connect(g).connect(out);o.start(when);o.stop(when+L+.9)})}
/* Bài hát chạy theo đồng hồ âm thanh riêng: bắt đầu 1 lần rồi phát liền mạch đến hết,
   không bị dừng khi video tạm dừng (hộp thoại) hay kết thúc. */
let songOn=false;
function stopSong(){songOn=false;try{master&&master.disconnect()}catch(e){}}
function startSong(){if(!ac||songOn)return;songOn=true;try{master&&master.disconnect()}catch(e){}
 master=ac.createGain();master.gain.value=CONFIG.songVolume;
 const conv=ac.createConvolver();conv.buffer=impulse();const wg=ac.createGain();wg.gain.value=.5;
 master.connect(ac.destination);master.connect(conv);conv.connect(wg).connect(ac.destination);
 const now=ac.currentTime+.05;
 NOTES.forEach(n=>voice(n.f,now+n.t,n.L,n.d,master))}
V.addEventListener('ended',()=>{$('#start').style.display='grid';$('#go').textContent='↻ Xem lại'});

$('#go').onclick=()=>{
 $('#start').style.display='none';
 if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
 ac.resume();stopSong();reset();gate.done=false;$('#gate').classList.remove('on');V.defaultPlaybackRate=V.playbackRate=CONFIG.speed;V.currentTime=0;V.play();
};
requestAnimationFrame(frame);
</script>
</body>
</html>
